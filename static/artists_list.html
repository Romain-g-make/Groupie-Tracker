<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liste des groupes</title>

  <link rel="stylesheet" href="/static/connexion.css">
  <style>

    .simple-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

    .simple-card{background:#000000;border-radius:8px;padding:8px;text-align:center;cursor:pointer;color:#fff}
    .thumb{height:110px;background:#111;border-radius:6px;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .name{margin-top:8px;font-weight:600;color:#fff}
    .top-actions{margin-bottom:12px}
  </style>
</head>
<body>
  <div class="container">
    <div class="top-actions">
      <a class="btn btn-primary" id="backHome" href="/static/page_connexion.html">← Accueil</a>
      <span style="margin-left:12px;color:#000">Liste des groupes</span>
    </div>

    <div id="main">Chargement...</div>
  </div>

  <script>

    async function load(){
      try{

        const r = await fetch('/api/artists');
        if(!r.ok) throw new Error('HTTP '+r.status);
        const list = await r.json();

        let html = '<div class="simple-grid">';
        for(const a of list){
          const img = a.image ? `<img src="${a.image}" alt="">` : '<div style="padding:24px;color:#666">Pas d\'image</div>';
          html += `<div class="simple-card" onclick="window.location='/static/artist_detail.html?id=${a.id}'">
                    <div class="thumb">${img}</div>
                    <div class="name">${a.name || '—'}</div>
                  </div>`;
        }
        html += '</div>';
        document.getElementById('main').innerHTML = html;

      }catch(err){
        document.getElementById('main').textContent = 'Erreur: '+err.message;
        console.error(err);
      }
    }
    load();
  </script>
</body>
</html>
