<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Détail artiste</title>

  <link rel="stylesheet" href="/static/artist_detail.css">
</head>
<body>
  <div class="wrap">
  <a class="btn" href="/static/artists_list.html">← Retour</a>
    <div style="height:12px"></div>

    <div id="main" class="layout">
      <div>
        <div id="photo" class="photo">Chargement image...</div>
        <div style="height:8px"></div>
        <div class="box">
          <div><strong>Année de création</strong><div id="creation">—</div></div>
          <div style="margin-top:8px"><strong>Premier album</strong><div id="firstAlbum">—</div></div>
        </div>
      </div>

      <div>
        <h1 id="name">Chargement…</h1>
        <div>ID: <span id="id">—</span></div>

        <div style="margin-top:12px"><strong>Membres</strong>
          <div id="members" class="members"></div>
        </div>

        <div style="margin-top:12px"><strong>Locations</strong>
          <div id="locations" class="box">—</div>
        </div>

        <div style="margin-top:12px"><strong>Dates de concerts</strong>
          <div id="concertDates" class="box">—</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getId(){ const p=new URLSearchParams(location.search); return p.get('id')?Number(p.get('id')):null }

    async function load(){
      try{
        const r = await fetch('/api/artists');
        if(!r.ok) throw new Error('HTTP '+r.status);
        const list = await r.json();

        const id = getId();
        let artist = null;
        if(id !== null) artist = (list||[]).find(a=>Number(a.id)===id);
        if(!artist) artist = (list && list.length)? list[0] : null;
        if(!artist){ document.getElementById('main').textContent='Aucun artiste'; return }

        document.getElementById('name').textContent = artist.name || '—';
        document.getElementById('id').textContent = artist.id ?? '—';

        const photo = document.getElementById('photo'); photo.innerHTML = '';
        if(artist.image) photo.innerHTML = `<img src="${artist.image}" alt="">`; else photo.textContent = 'Pas d\'image';

        document.getElementById('creation').textContent = artist.creationDate ?? '—';
        document.getElementById('firstAlbum').textContent = artist.firstAlbum || '—';

        const m = document.getElementById('members'); m.innerHTML=''; (artist.members||[]).forEach(x=>{const s=document.createElement('span');s.className='member';s.textContent=x; m.appendChild(s)});

        document.getElementById('locations').textContent = artist.locations || '—';
        document.getElementById('concertDates').textContent = artist.concertDates || '—';

      }catch(err){ document.getElementById('main').textContent = 'Erreur: '+err.message; console.error(err) }
    }
    load();
  </script>
</body>
</html>
