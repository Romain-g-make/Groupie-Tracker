<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Détail artiste</title>
  <!-- Réutilise le style principal pour garder les mêmes couleurs -->
  <link rel="stylesheet" href="connexion.css">
  <link rel="stylesheet" href="/static/connexion.css">
  <style>
    /* Très simple: deux colonnes sur grand écran, une colonne sur mobile */
    .wrap{max-width:1000px;margin:18px auto}
    .layout{display:grid;grid-template-columns:260px 1fr;gap:18px}
    @media (max-width:760px){.layout{grid-template-columns:1fr}}
    .photo{width:100%;height:260px;background:#eee;border-radius:8px;overflow:hidden}
    .photo img{width:100%;height:100%;object-fit:cover}
    .box{background:rgba(255,255,255,0.95);padding:10px;border-radius:8px}
    .members{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .member{background:#f0f0f6;padding:6px 10px;border-radius:999px}
    .btn{display:inline-block;padding:8px 12px;background:#2d6cdf;color:#fff;border-radius:6px;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
  <a class="btn" href="/static/artists_list.html">← Retour</a>
  <div id="main" class="layout">
    <div>
      <div style="height:8px"></div>
      <img src="{{.Is_artist.Image}}" alt="Photo de {{.Is_artist.Nom}}">
      <div class="box">
        <div><strong>Année de création</strong><div>{{.Is_artist.Annee_deb}}</div></div>
        <div style="margin-top:8px"><strong>Premier album</strong><div>{{.Is_artist.Date_prem_alb}}</div></div>
      </div>
    </div>
    <div>
      <div>ID:{{.Is_artist.Id}}</span></div>
      <div style="margin-top:12px"><strong>Membres</strong>
        <div class="members">{{.Is_artist.Membres}}</div>
      </div>
      <div style="margin-top:12px"><strong>Locations</strong>
        <div class="box">{{.Is_artist.Locations}}</div>
      </div>
      <div style="margin-top:12px"><strong>Dates de concerts</strong>
        <div class="box">{{.Is_artist.Date_concerts}}</div>
      </div>
    </div>
  </div>
  </div>
</body>
</html>
